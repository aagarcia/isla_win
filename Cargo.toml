[package]
name = "isla_win"
version = "0.1.0"
edition = "2024"

[dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_WinRT", "Media_Control", "Foundation", "Graphics_Imaging", "Storage_Streams", "Foundation_Collections", "Win32_UI_Shell", "Win32_Globalization", "Win32_UI_Controls"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
